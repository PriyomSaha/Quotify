name: Manual Quote Post

on:
  workflow_dispatch:
    inputs:
      quote:
        description: 'Quote text to post (use \\n for line breaks)'
        required: true
        type: string

concurrency:
  group: aesthetic-vibes-publisher
  cancel-in-progress: false

jobs:
  post-quote:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Post quote (manual - scheduler bypassed)
        env:
          PAGE_ID: ${{ secrets.PAGE_ID }}
          PAGE_ACCESS_TOKEN: ${{ secrets.PAGE_ACCESS_TOKEN }}
          API_VERSION: ${{ secrets.API_VERSION }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          QUOTE_INPUT: ${{ github.event.inputs.quote }}
        run: |
          python post_quote_manual.py

      - name: Cleanup
        if: always()
        run: |
          if [ -f image.jpg ]; then
            rm image.jpg
            echo "Cleaned up image.jpg"
          fi
