name: Reel Scheduler

on:
  # Run every 5 minutes to reduce missed windows
  schedule:
    - cron: '*/5 * * * *'  # Every 5 minutes
  
  # Manual trigger for testing
  workflow_dispatch:
    inputs:
      test_date:
        description: 'Optional event test date in YYYY-MM-DD format, e.g. 2026-08-15'
        required: false
        default: ''
      force_publish:
        description: 'Bypass scheduler window for manual testing'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

concurrency:
  group: aesthetic-vibes-publisher
  cancel-in-progress: false

jobs:
  check-and-generate-reel:
    runs-on: ubuntu-latest
    timeout-minutes: 40  # Increased for reel generation (20-25 min) + upload
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      
      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Cache Whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/whisper
          key: whisper-model-base
          restore-keys: |
            whisper-model-
      
      # The publish/skip gate only applies to scheduled (cron) runs.
      # On manual workflow_dispatch the gate is skipped entirely: the generate
      # step runs unconditionally, detects the current IST time-frame via
      # smart_scheduler.get_active_window (falls back to next-pending slot),
      # and publishes regardless of whether a window is currently active.
      - name: Check if reel should be generated
        if: github.event_name == 'schedule'
        id: check
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          SCHEDULER_GIST_ID: ${{ secrets.SCHEDULER_GIST_ID }}
          CONTENT_HISTORY_GIST_ID: ${{ secrets.CONTENT_HISTORY_GIST_ID }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          PAGE_ID: ${{ secrets.PAGE_ID }}
          PAGE_ACCESS_TOKEN: ${{ secrets.PAGE_ACCESS_TOKEN }}
          API_VERSION: ${{ secrets.API_VERSION }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          EVENT_TEST_DATE: ${{ github.event.inputs.test_date }}
          FORCE_PUBLISH: ${{ github.event.inputs.force_publish }}
        run: |
          python -c "
          from smart_scheduler import should_publish_reel, get_schedule_summary
          from smart_scheduler import ContentType
          import sys
          
          # Show today's schedule
          get_schedule_summary()
          
          import os
          force_publish = os.getenv('FORCE_PUBLISH', '').lower() == 'true'

          # Check if we should generate reel
          if force_publish:
              should_publish, reason = True, 'Manual force_publish enabled'
          else:
              should_publish, reason = should_publish_reel()
          
          print(f'\n📊 Decision: {\"GENERATE REEL\" if should_publish else \"SKIP\"}')
          print(f'📝 Reason: {reason}\n')
          
          # Set output for next step
          if should_publish:
              print('SHOULD_PUBLISH=true')
              sys.exit(0)
          else:
              print('SHOULD_PUBLISH=false')
              sys.exit(0)
          " | tee check_result.txt
          
          # Extract decision
          if grep -q "SHOULD_PUBLISH=true" check_result.txt; then
            echo "should_publish=true" >> $GITHUB_OUTPUT
          else
            echo "should_publish=false" >> $GITHUB_OUTPUT
          fi

      - name: Generate and upload reel
        if: github.event_name == 'workflow_dispatch' || steps.check.outputs.should_publish == 'true'
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          SCHEDULER_GIST_ID: ${{ secrets.SCHEDULER_GIST_ID }}
          CONTENT_HISTORY_GIST_ID: ${{ secrets.CONTENT_HISTORY_GIST_ID }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_TOKEN2: ${{ secrets.HF_TOKEN2 }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          CF_ACCOUNT_ID_1: ${{ secrets.CF_ACCOUNT_ID_1 }}
          CF_TOKEN_1: ${{ secrets.CF_TOKEN_1 }}
          CF_ACCOUNT_ID_2: ${{ secrets.CF_ACCOUNT_ID_2 }}
          CF_TOKEN_2: ${{ secrets.CF_TOKEN_2 }}
          CF_ACCOUNT_ID_3: ${{ secrets.CF_ACCOUNT_ID_3 }}
          CF_TOKEN_3: ${{ secrets.CF_TOKEN_3 }}
          CF_ACCOUNT_ID_4: ${{ secrets.CF_ACCOUNT_ID_4 }}
          CF_TOKEN_4: ${{ secrets.CF_TOKEN_4 }}
          CF_ACCOUNT_ID_5: ${{ secrets.CF_ACCOUNT_ID_5 }}
          CF_TOKEN_5: ${{ secrets.CF_TOKEN_5 }}
          CF_ACCOUNT_ID_6: ${{ secrets.CF_ACCOUNT_ID_6 }}
          CF_TOKEN_6: ${{ secrets.CF_TOKEN_6 }}
          CF_ACCOUNT_ID_7: ${{ secrets.CF_ACCOUNT_ID_7 }}
          CF_TOKEN_7: ${{ secrets.CF_TOKEN_7 }}
          CF_ACCOUNT_ID_8: ${{ secrets.CF_ACCOUNT_ID_8 }}
          CF_TOKEN_8: ${{ secrets.CF_TOKEN_8 }}
          PAGE_ID: ${{ secrets.PAGE_ID }}
          PAGE_ACCESS_TOKEN: ${{ secrets.PAGE_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          API_VERSION: ${{ secrets.API_VERSION }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          AUTO_UPLOAD_REELS: "true"
          EVENT_TEST_DATE: ${{ github.event.inputs.test_date }}
          FORCE_PUBLISH: ${{ github.event.inputs.force_publish }}
        run: |
          python -c "
          import sys
          import logging
          
          logging.basicConfig(
              level=logging.INFO,
              format='%(asctime)s - %(levelname)s - %(message)s',
              handlers=[logging.StreamHandler(sys.stdout)],
              force=True
          )
          logger = logging.getLogger(__name__)
          
          print('\n' + '='*70)
          print('🎬 STARTING REEL GENERATION (20-25 minutes)')
          print('='*70 + '\n')
          
          from api import execute_reel_generation
          from smart_scheduler import acquire_run_lock, release_run_lock, mark_slot_completed, get_active_window, is_manual_dispatch_trigger, ContentType
          import os
          
          is_manual = is_manual_dispatch_trigger()
          active_window = get_active_window(ContentType.REEL)

          if active_window:
              if not acquire_run_lock(ContentType.REEL, active_window):
                  if is_manual:
                      print('⚠️ Could not acquire scheduler lock (slot already completed or another job running); proceeding with manual publish.')
                  else:
                      raise RuntimeError('Could not acquire scheduler run lock')
          else:
              if is_manual:
                  print('ℹ️ No reel time-frame window determined; proceeding without a scheduler slot (manual publish).')
              else:
                  raise RuntimeError('No active reel window found before generation')
          
          try:
              # This raises if upload is not fully successful.
              execute_reel_generation()
              
              print('\n' + '='*70)
              print('🎉 REEL GENERATION AND UPLOAD COMPLETE')
              print('='*70 + '\n')
              
              if active_window:
                  print(f'✅ Marking slot "{active_window.name}" as completed...')
                  mark_slot_completed(active_window)
              else:
                  print('ℹ️ No scheduler slot to mark completed (manual publish without window).')
              sys.exit(0)
              
          except Exception as e:
              if active_window:
                  release_run_lock(ContentType.REEL, active_window)
              logger.error(f'❌ Reel generation failed: {e}')
              import traceback
              logger.error(traceback.format_exc())
              sys.exit(1)
          "
      
      - name: Skip - not in posting window
        if: github.event_name == 'schedule' && steps.check.outputs.should_publish != 'true'
        run: |
          echo "⏭️ Skipping reel generation - not in posting window or already completed"
