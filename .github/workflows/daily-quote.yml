name: Daily Quote Autopilot

on:
  schedule:
    # Run at 3:30 AM UTC = 9:00 AM IST (Kolkata time)
    - cron: '30 3 * * *'
  workflow_dispatch:  # Allows manual triggering from GitHub UI

jobs:
  post-quote:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      
      - name: Run autopilot pipeline
        env:
          # Add your environment variables as GitHub Secrets
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          # Add any other API keys/secrets you need
        run: |
          python cron_autopilot.py
