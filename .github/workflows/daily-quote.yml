name: Daily Quote Autopilot

on:
  schedule:
    # Run every hour from 6:30 AM IST to 1:30 PM IST (8 posts per day)
    # 6:30 AM IST = 1:00 AM UTC (hour 1)
    # 7:30 AM IST = 2:00 AM UTC (hour 2)
    # 8:30 AM IST = 3:00 AM UTC (hour 3)
    # 9:30 AM IST = 4:00 AM UTC (hour 4)
    # 10:30 AM IST = 5:00 AM UTC (hour 5)
    # 11:30 AM IST = 6:00 AM UTC (hour 6)
    # 12:30 PM IST = 7:00 AM UTC (hour 7)
    # 1:30 PM IST = 8:00 AM UTC (hour 8)
    - cron: '0 1-8 * * *'
  workflow_dispatch:  # Allows manual triggering from GitHub UI

jobs:
  post-quote:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      
      - name: Run autopilot pipeline
        env:
          # Add your environment variables as GitHub Secrets
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PAGE_ID: ${{ secrets.PAGE_ID }}
          PAGE_ACCESS_TOKEN: ${{ secrets.PAGE_ACCESS_TOKEN }}
          API_VERSION: ${{ secrets.API_VERSION }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: |
          python cron_autopilot.py
