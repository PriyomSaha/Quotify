name: Daily Quote Autopilot

on:
  schedule:
    # Run throughout the day with randomized minutes (looks organic, not bot-like)
    # 6:53 AM to 11:47 PM IST - 17 posts per day with ~1 hour gaps
    - cron: '23 1 * * *'   # 6:53 AM IST (1:23 AM UTC)
    - cron: '47 2 * * *'   # 8:17 AM IST (2:47 AM UTC)
    - cron: '11 3 * * *'   # 8:41 AM IST (3:11 AM UTC)
    - cron: '34 4 * * *'   # 10:04 AM IST (4:34 AM UTC)
    - cron: '19 5 * * *'   # 10:49 AM IST (5:19 AM UTC)
    - cron: '52 6 * * *'   # 12:22 PM IST (6:52 AM UTC)
    - cron: '16 7 * * *'   # 12:46 PM IST (7:16 AM UTC)
    - cron: '41 8 * * *'   # 2:11 PM IST (8:41 AM UTC)
    - cron: '28 9 * * *'   # 2:58 PM IST (9:28 AM UTC)
    - cron: '7 10 * * *'   # 3:37 PM IST (10:07 AM UTC)
    - cron: '49 11 * * *'  # 5:19 PM IST (11:49 AM UTC)
    - cron: '22 12 * * *'  # 5:52 PM IST (12:22 PM UTC)
    - cron: '38 13 * * *'  # 7:08 PM IST (1:38 PM UTC)
    - cron: '14 14 * * *'  # 7:44 PM IST (2:14 PM UTC)
    - cron: '56 15 * * *'  # 9:26 PM IST (3:56 PM UTC)
    - cron: '31 16 * * *'  # 10:01 PM IST (4:31 PM UTC)
    - cron: '17 17 * * *'  # 10:47 PM IST (5:17 PM UTC)
  workflow_dispatch:  # Allows manual triggering from GitHub UI

jobs:
  post-quote:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      
      - name: Run autopilot pipeline
        env:
          # Add your environment variables as GitHub Secrets
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PAGE_ID: ${{ secrets.PAGE_ID }}
          PAGE_ACCESS_TOKEN: ${{ secrets.PAGE_ACCESS_TOKEN }}
          API_VERSION: ${{ secrets.API_VERSION }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: |
          python cron_autopilot.py
