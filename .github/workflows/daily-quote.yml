name: Daily Quote Autopilot

on:
  schedule:
    # Run every hour from 9:30 AM IST to 10:30 PM IST
    # (4:00 AM UTC to 5:00 PM UTC = hours 4-17)
    - cron: '0 4-17 * * *'
  workflow_dispatch:  # Allows manual triggering from GitHub UI

jobs:
  post-quote:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      
      - name: Run autopilot pipeline
        env:
          # Add your environment variables as GitHub Secrets
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PAGE_ID: ${{ secrets.PAGE_ID }}
          PAGE_ACCESS_TOKEN: ${{ secrets.PAGE_ACCESS_TOKEN }}
          API_VERSION: ${{ secrets.API_VERSION }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: |
          python cron_autopilot.py
