name: Quote Scheduler

on:
  # Run every 5 minutes to reduce missed windows
  schedule:
    - cron: '*/5 * * * *'  # Every 5 minutes
  
  # Manual trigger for testing
  workflow_dispatch:
    inputs:
      test_date:
        description: 'Optional event test date in YYYY-MM-DD format, e.g. 2026-08-15'
        required: false
        default: ''
      force_publish:
        description: 'Bypass scheduler window for manual testing'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

concurrency:
  group: aesthetic-vibes-publisher
  cancel-in-progress: false

jobs:
  check-and-post-quote:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      
      # The publish/skip gate only applies to scheduled (cron) runs.
      # On manual workflow_dispatch the gate is skipped entirely: the generate
      # step runs unconditionally, detects the current IST time-frame via
      # smart_scheduler.get_active_window (falls back to next-pending slot),
      # and publishes regardless of whether a window is currently active.
      - name: Check if quote should be published
        if: github.event_name == 'schedule'
        id: check
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          SCHEDULER_GIST_ID: ${{ secrets.SCHEDULER_GIST_ID }}
          CONTENT_HISTORY_GIST_ID: ${{ secrets.CONTENT_HISTORY_GIST_ID }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          PAGE_ID: ${{ secrets.PAGE_ID }}
          PAGE_ACCESS_TOKEN: ${{ secrets.PAGE_ACCESS_TOKEN }}
          API_VERSION: ${{ secrets.API_VERSION }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EVENT_TEST_DATE: ${{ github.event.inputs.test_date }}
          FORCE_PUBLISH: ${{ github.event.inputs.force_publish }}
        run: |
          python -c "
          from smart_scheduler import should_publish_quote, get_schedule_summary
          from smart_scheduler import ContentType
          import sys
          
          # Show today's schedule
          get_schedule_summary()
          
          import os
          force_publish = os.getenv('FORCE_PUBLISH', '').lower() == 'true'

          # Check if we should publish
          if force_publish:
              should_publish, reason = True, 'Manual force_publish enabled'
          else:
              should_publish, reason = should_publish_quote()
          
          print(f'\n📊 Decision: {\"PUBLISH\" if should_publish else \"SKIP\"}')
          print(f'📝 Reason: {reason}\n')
          
          # Set output for next step
          if should_publish:
              print('SHOULD_PUBLISH=true')
              sys.exit(0)
          else:
              print('SHOULD_PUBLISH=false')
              sys.exit(0)
          " | tee check_result.txt
          
          # Extract decision
          if grep -q "SHOULD_PUBLISH=true" check_result.txt; then
            echo "should_publish=true" >> $GITHUB_OUTPUT
          else
            echo "should_publish=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Generate and post quote
        if: github.event_name == 'workflow_dispatch' || steps.check.outputs.should_publish == 'true'
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          SCHEDULER_GIST_ID: ${{ secrets.SCHEDULER_GIST_ID }}
          CONTENT_HISTORY_GIST_ID: ${{ secrets.CONTENT_HISTORY_GIST_ID }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PAGE_ID: ${{ secrets.PAGE_ID }}
          PAGE_ACCESS_TOKEN: ${{ secrets.PAGE_ACCESS_TOKEN }}
          API_VERSION: ${{ secrets.API_VERSION }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          EVENT_TEST_DATE: ${{ github.event.inputs.test_date }}
          FORCE_PUBLISH: ${{ github.event.inputs.force_publish }}
        run: |
          python -c "
          print('\n' + '='*70)
          print('🚀 STARTING QUOTE GENERATION AND UPLOAD')
          print('='*70 + '\n')
          
          # Import after environment variables are set
          from QuoteGeneration import generate_quote, build_quote_post_caption
          from ImageGeneration import create_neon_quote_image
          from FBUpload import schedule_photo_after, post_to_instagram_from_fb_url
          from smart_scheduler import acquire_run_lock, release_run_lock, mark_slot_completed, get_active_window, is_manual_dispatch_trigger, ContentType
          from gist_storage import add_to_history
          from event_detector import get_today_event
          import os
          import PromptSelector
          
          is_manual = is_manual_dispatch_trigger()
          active_window = get_active_window(ContentType.QUOTE)

          if active_window:
              if not acquire_run_lock(ContentType.QUOTE, active_window):
                  if is_manual:
                      print('⚠️ Could not acquire scheduler lock (slot already completed or another job running); proceeding with manual publish.')
                  else:
                      raise RuntimeError('Could not acquire scheduler run lock')
          else:
              if is_manual:
                  print('ℹ️ No quote time-frame window determined; proceeding without a scheduler slot (manual publish).')
              else:
                  raise RuntimeError('No active quote window found before posting')
          
          try:
              # Generate quote without updating content history yet.
              print('📝 Step 1/4: Generating AI quote...')
              quote_text = generate_quote(record_history=False)
              print(f'✅ Quote generated: {quote_text[:100]}...\n')
              
              # Create image
              print('🎨 Step 2/4: Creating neon image...')
              create_neon_quote_image(
                  raw_text=quote_text,
                  template_path='template.jpg',
                  output_path='image.jpg'
              )
              print('✅ Image created\n')
              
              # Upload to Facebook
              print('📤 Step 3/4: Uploading to Facebook...')
              event = get_today_event(content_type='quote')
              caption = build_quote_post_caption(quote_text, event)
              if caption:
                  print(f'Caption preview: {caption[:200]}')

              fb_cdn_url = schedule_photo_after(
                  image_path='image.jpg',
                  caption=caption,
                  hours=0,
                  minutes=0
              )
              if not fb_cdn_url:
                  raise RuntimeError('Facebook upload did not return CDN URL')
              print('✅ Facebook upload complete\n')
              
              # Upload to Instagram
              print('📱 Step 4/4: Publishing to Instagram...')
              ig_result = post_to_instagram_from_fb_url(
                  fb_image_url=fb_cdn_url,
                  caption=caption
              )
              ig_post_id = ig_result.get('id', '')
              if not ig_post_id:
                  raise RuntimeError(f'Instagram publish failed: {ig_result}')
              print(f'✅ Instagram post complete: {ig_post_id}\n')
              
              # Mark content type history only after confirmed upload.
              selected = getattr(PromptSelector, 'LAST_SELECTED_CONTENT_INFO', None)
              if selected and selected.get('type'):
                  add_to_history(selected['type'])
              
              if active_window:
                  print(f'✅ Marking slot "{active_window.name}" as completed...')
                  mark_slot_completed(active_window)
              else:
                  print('ℹ️ No scheduler slot to mark completed (manual publish without window).')
              
              print('\n' + '='*70)
              print('🎉 QUOTE POSTED SUCCESSFULLY!')
              print('='*70 + '\n')
          except Exception:
              if active_window:
                  release_run_lock(ContentType.QUOTE, active_window)
              raise
          finally:
              if os.path.exists('image.jpg'):
                  os.remove('image.jpg')
          "
      
      - name: Skip - not in posting window
        if: github.event_name == 'schedule' && steps.check.outputs.should_publish != 'true'
        run: |
          echo "⏭️ Skipping quote generation - not in posting window or already completed"
